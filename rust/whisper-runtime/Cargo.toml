[package]
name = "whisper-runtime"
version = "0.1.0"
edition = "2021"

[features]
default = []
cuda = ["whisper-rs-sys/cuda"]

[dependencies]
axum = { version = "=0.8.4", features = ["multipart"] }
clap = { version = "=4.6.7", features = ["derive"] }
dotenvy = "=0.15.7"
hound = "=3.5.1"
percent-encoding = "=2.3.2"
regex = "=1.13.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "=0.6.11", features = ["limit"] }
uuid = { version = "=1.18.1", features = ["v4"] }
whisper-rs-sys = { version = "=0.15.0", default-features = false }